runtime: python312
instance_class: F1

entrypoint: gunicorn -b :$PORT app:app

env_variables:
  GAME_BACKEND: "firestore"
  FIRESTORE_DATABASE: "(default)"
  FLASK_SECRET_ID: "flask-secret-key"
  FLASK_SECRET_VERSION: "1"

automatic_scaling:
  max_instances: 5

handlers:
- url: /static
  static_dir: static/
